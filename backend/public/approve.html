<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Host Authorization — USB Killswitch</title>
  <meta name="description" content="Hardware cryptographic key authorization gateway">
  <!-- Immediate theme bootstrap to prevent FOUC -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════
       Design System — Anti-AI Engineered Gateway
       ═══════════════════════════════════════════════ */

    /* DARK MODE (Default) */
    :root,
    [data-theme="dark"] {
      color-scheme: dark;
      accent-color: #6366f1;

      --bg-canvas:       #0c0e14;
      --bg-surface:      #13161f;
      --bg-surface-elev: #181c27;
      --bg-subtle:       #10131a;
      --bg-hover:        #1d2230;

      --border-base:     #232838;
      --border-subtle:   #1b1f2b;
      --border-focus:    #6366f1;

      --text-main:       #f1f5f9;
      --text-muted:      #8a95a5;
      --text-dim:        #576275;

      --accent:          #6366f1;
      --accent-hover:    #4f46e5;
      --accent-subtle:   rgba(99, 102, 241, 0.12);
      --accent-border:   rgba(99, 102, 241, 0.28);

      --status-ok:       #10b981;
      --status-ok-bg:    rgba(16, 185, 129, 0.1);
      --status-ok-bd:    rgba(16, 185, 129, 0.25);

      --status-err:      #ef4444;
      --status-err-bg:   rgba(239, 68, 68, 0.1);
      --status-err-bd:   rgba(239, 68, 68, 0.25);

      --status-warn:     #f59e0b;
      --status-warn-bg:  rgba(245, 158, 11, 0.1);
      --status-warn-bd:  rgba(245, 158, 11, 0.25);

      --status-info:     #0ea5e9;
      --status-info-bg:  rgba(14, 165, 233, 0.1);
      --status-info-bd:  rgba(14, 165, 233, 0.25);

      --shadow-card:     0 8px 30px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.25);
      --grid-pattern:    radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    }

    /* LIGHT MODE — Editorial Light Ivory with Royal Indigo */
    [data-theme="light"] {
      color-scheme: light;
      accent-color: #3730a3;

      --bg-canvas:       #faf7f2; /* Pure warm ivory */
      --bg-surface:      #ffffff;
      --bg-surface-elev: #f5f1ea;
      --bg-subtle:       #f3efe7;
      --bg-hover:        #eeece4;

      --border-base:     #e2dcd2;
      --border-subtle:   #ebe5dc;
      --border-focus:    #3730a3;

      --text-main:       #1c1917;
      --text-muted:      #57534e;
      --text-dim:        #8c857b;

      --accent:          #3730a3;
      --accent-hover:    #312e81;
      --accent-subtle:   #eef2ff;
      --accent-border:   #c7d2fe;

      --status-ok:       #047857;
      --status-ok-bg:    #ecfdf5;
      --status-ok-bd:    #a7f3d0;

      --status-err:      #b91c1c;
      --status-err-bg:   #fef2f2;
      --status-err-bd:   #fecaca;

      --status-warn:     #b45309;
      --status-warn-bg:  #fffbeb;
      --status-warn-bd:  #fde68a;

      --status-info:     #0369a1;
      --status-info-bg:  #f0f9ff;
      --status-info-bd:  #bae6fd;

      --shadow-card:     0 4px 20px -2px rgba(28, 25, 23, 0.06), 0 1px 3px rgba(28, 25, 23, 0.04);
      --grid-pattern:    radial-gradient(rgba(28, 25, 23, 0.04) 1px, transparent 1px);
    }

    :root {
      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-canvas);
      background-image: var(--grid-pattern);
      background-size: 24px 24px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .wrapper {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .top-shelf {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand-signature {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
    }
    .brand-badge {
      width: 24px;
      height: 24px;
      background: var(--bg-surface);
      border: 1px solid var(--border-base);
      border-radius: var(--radius-xs);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .theme-switch-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-base);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .theme-switch-btn:hover {
      color: var(--text-main);
      background: var(--bg-hover);
    }

    .card-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-base);
      border-radius: var(--radius-md);
      padding: 26px 24px;
      box-shadow: var(--shadow-card);
    }

    .card-header {
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Verification Code Display */
    .token-block {
      background: var(--bg-subtle);
      border: 1px solid var(--border-base);
      border-radius: var(--radius-sm);
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
    }
    .token-label {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .token-code {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--status-warn);
      font-variant-numeric: tabular-nums;
    }

    /* Data Spec Sheet */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-bottom: 20px;
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }
    .data-table td {
      padding: 8px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .data-table tr:last-child td {
      border-bottom: none;
    }
    .data-table .cell-key {
      color: var(--text-dim);
      font-weight: 500;
      width: 35%;
    }
    .data-table .cell-val {
      color: var(--text-main);
      font-weight: 600;
      text-align: right;
      word-break: break-all;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: var(--radius-xs);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .status-chip::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }
    .status-chip.warn { background: var(--status-warn-bg); color: var(--status-warn); border: 1px solid var(--status-warn-bd); }
    .status-chip.ok   { background: var(--status-ok-bg); color: var(--status-ok); border: 1px solid var(--status-ok-bd); }
    .status-chip.err  { background: var(--status-err-bg); color: var(--status-err); border: 1px solid var(--status-err-bd); }

    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-action {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-base);
      background: var(--bg-surface-elev);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn-action:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--border-focus);
    }
    .btn-action:active:not(:disabled) {
      transform: translateY(1px);
    }
    .btn-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-action.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .btn-action.primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-action.danger {
      background: var(--status-err-bg);
      border-color: var(--status-err-bd);
      color: var(--status-err);
    }
    .btn-action.danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.2);
    }

    /* Auth prompt */
    .auth-box {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
    }
    .auth-box label {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .text-field {
      width: 100%;
      background: var(--bg-canvas);
      border: 1px solid var(--border-base);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 12px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .text-field:focus {
      border-color: var(--accent);
      background: var(--bg-surface);
    }

    /* Results */
    .result-view {
      text-align: center;
      padding: 24px 8px;
    }
    .result-glyph {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .result-glyph.ok {
      background: var(--status-ok-bg);
      color: var(--status-ok);
      border: 1px solid var(--status-ok-bd);
    }
    .result-glyph.err {
      background: var(--status-err-bg);
      color: var(--status-err);
      border: 1px solid var(--status-err-bd);
    }
    .result-headline {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .result-subline {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .loader {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border-base);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 28px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bottom-note {
      text-align: center;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="top-shelf">
      <a href="/dashboard" class="brand-signature">
        <div class="brand-badge">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <span>USB Killswitch</span>
      </a>

      <button class="theme-switch-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme">
        <span id="themeIconSvg">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
          </svg>
        </span>
        <span id="themeLabelText">Light Ivory</span>
      </button>
    </div>

    <!-- Main Card Panel -->
    <div class="card-panel" id="mainCard">
      <div id="loadingState">
        <div class="loader"></div>
        <p style="text-align: center; font-size: 12px; color: var(--text-dim); font-family: var(--font-mono);">verifying request code...</p>
      </div>

      <div id="contentState" style="display: none;">
        <div class="card-header">
          <div class="card-title">Device Authorization Gate</div>
          <div class="card-desc">Review and authorize out-of-band host key share release</div>
        </div>

        <div class="token-block">
          <div class="token-label">Verification Code</div>
          <div class="token-code" id="dispCode">------</div>
        </div>

        <table class="data-table">
          <tbody>
            <tr>
              <td class="cell-key">Storage Unit</td>
              <td class="cell-val" id="dispDriveLabel">—</td>
            </tr>
            <tr>
              <td class="cell-key">Vault Owner</td>
              <td class="cell-val" id="dispOwnerEmail">—</td>
            </tr>
            <tr>
              <td class="cell-key">Requester</td>
              <td class="cell-val" id="dispRequesterEmail">—</td>
            </tr>
            <tr>
              <td class="cell-key">Hardware Hash</td>
              <td class="cell-val" id="dispFingerprint" style="font-family: var(--font-mono); font-size: 11px;">—</td>
            </tr>
            <tr>
              <td class="cell-key">State</td>
              <td class="cell-val">
                <span class="status-chip warn" id="dispStatus">Pending</span>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Owner Auth Section if not signed in -->
        <div id="authSection" class="auth-box" style="display: none;">
          <label for="ownerEmailInput">Confirm drive owner identity:</label>
          <input type="email" id="ownerEmailInput" class="text-field" placeholder="owner@domain.com">
        </div>

        <!-- Action Command Stack -->
        <div class="action-stack" id="actionButtons">
          <button class="btn-action" onclick="submitDecision('ONE_TIME')">
            Authorize One-Time (12 Hours)
          </button>
          
          <button class="btn-action" onclick="submitDecision('CUSTOM_LEASE', 24)">
            Issue 24-Hour Host Lease
          </button>

          <button class="btn-action" onclick="submitDecision('CUSTOM_LEASE', 168)">
            Issue 7-Day Host Lease
          </button>

          <button class="btn-action primary" onclick="submitDecision('FOREVER')">
            Trust Host Permanently
          </button>

          <button class="btn-action danger" onclick="submitDecision('DENY')">
            Reject & Revoke
          </button>
        </div>
      </div>

      <!-- Result Feedback Overlay -->
      <div id="resultState" style="display: none;"></div>
    </div>

    <div class="bottom-note">
      AES-256-GCM Hardware-Bound Cloud Split Key Protocol
    </div>
  </div>

  <script>
    let currentRequestId = '';
    let requestData = null;

    const sunIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>`;
    const moonIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

    function updateThemeUI(theme) {
      const iconWrap = document.getElementById('themeIconSvg');
      const label = document.getElementById('themeLabelText');
      if (iconWrap && label) {
        if (theme === 'dark') {
          iconWrap.innerHTML = sunIcon;
          label.textContent = 'Light Ivory';
        } else {
          iconWrap.innerHTML = moonIcon;
          label.textContent = 'Dark Mode';
        }
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeUI(next);
    }

    function getRequestId() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('req')) return params.get('req').trim().toUpperCase();
      if (params.get('id')) return params.get('id').trim().toUpperCase();
      
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      if (pathParts.length >= 2 && pathParts[0] === 'approve') {
        return pathParts[1].trim().toUpperCase();
      }
      return '';
    }

    async function checkOwnerAuth() {
      try {
        const res = await fetch('/api/owner/me');
        if (res.ok) {
          const data = await res.json();
          if (data.authenticated && data.owner_email) {
            document.getElementById('ownerEmailInput').value = data.owner_email;
            return data.owner_email;
          }
        }
      } catch (e) {}
      return null;
    }

    async function loadRequest() {
      const activeTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', activeTheme);
      updateThemeUI(activeTheme);

      currentRequestId = getRequestId();
      if (!currentRequestId) {
        showError("Invalid or missing verification code in URL.");
        return;
      }

      document.getElementById('dispCode').innerText = currentRequestId;

      try {
        const res = await fetch(`/api/request-info/${currentRequestId}`);
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          showError(err.error || "Request not found or expired.");
          return;
        }

        requestData = await res.json();
        const currentAuthUser = await checkOwnerAuth();
        renderRequest(requestData, currentAuthUser);

      } catch (err) {
        showError("Unable to connect to gateway: " + err.message);
      }
    }

    function renderRequest(req, currentAuthUser) {
      document.getElementById('dispDriveLabel').innerText = req.drive_label || 'USB Drive';
      document.getElementById('dispOwnerEmail').innerText = req.owner_email || '—';
      document.getElementById('dispRequesterEmail').innerText = req.requester_email || 'Unspecified';
      document.getElementById('dispFingerprint').innerText = req.fingerprint_preview || '—';
      
      const statusChip = document.getElementById('dispStatus');
      statusChip.innerText = req.status;
      statusChip.className = 'status-chip ' + (req.status === 'APPROVED' ? 'ok' : req.status === 'DENIED' ? 'err' : 'warn');

      const isOwner = currentAuthUser && currentAuthUser.toLowerCase() === (req.owner_email || '').toLowerCase();
      const isGuest = currentAuthUser && !isOwner;

      if (req.status !== 'PENDING') {
        document.getElementById('actionButtons').style.display = 'none';
        document.getElementById('authSection').style.display = 'none';
      } else if (isGuest) {
        document.getElementById('actionButtons').style.display = 'none';
        document.getElementById('authSection').style.display = 'block';
        document.getElementById('authSection').innerHTML = `
          <div style="background: var(--bg-subtle); border: 1px solid var(--border-base); border-radius: var(--radius-sm); padding: 14px; text-align: center;">
            <div style="font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 4px;">Authorization Pending</div>
            <div style="font-size: 12px; color: var(--text-muted); line-height: 1.4;">
              Signed in as <strong>${currentAuthUser}</strong>.<br>
              Awaiting owner confirmation from <strong>${req.owner_email}</strong>.
            </div>
          </div>
        `;
      } else if (!isOwner) {
        document.getElementById('authSection').style.display = 'block';
        if (req.owner_email) {
          document.getElementById('ownerEmailInput').placeholder = req.owner_email;
        }
      } else {
        document.getElementById('authSection').style.display = 'none';
      }

      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('contentState').style.display = 'block';
    }

    async function submitDecision(action, hours) {
      const emailInput = document.getElementById('ownerEmailInput');
      const ownerEmail = emailInput ? emailInput.value.trim() : '';

      setButtonsLoading(true);

      try {
        let endpoint = action === 'DENY' ? '/api/deny-quick' : '/api/approve-quick';
        let body = {
          request_id: currentRequestId,
          owner_email: ownerEmail
        };

        if (action !== 'DENY') {
          body.scope = action;
          if (hours) body.lease_hours = hours;
        }

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();
        if (!res.ok) {
          alert(data.error || "Command rejected.");
          setButtonsLoading(false);
          return;
        }

        showSuccess(
          action === 'DENY' ? 'Authorization Denied' : 'Host Authorized', 
          action === 'DENY' ? 'The requesting host device has been rejected.' : `Granted scope: ${action} (${hours ? hours + 'h' : 'Permanent/12h'}). Cloud key share delivered.`
        );

      } catch (err) {
        alert("Network failure: " + err.message);
        setButtonsLoading(false);
      }
    }

    function setButtonsLoading(isLoading) {
      const buttons = document.querySelectorAll('.action-stack button');
      buttons.forEach(b => b.disabled = isLoading);
    }

    function showSuccess(title, message) {
      document.getElementById('contentState').style.display = 'none';
      const result = document.getElementById('resultState');
      result.style.display = 'block';
      result.innerHTML = `
        <div class="result-view">
          <div class="result-glyph ok">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="result-headline">${title}</div>
          <div class="result-subline">${message}</div>
          <p style="font-size: 11px; font-family: var(--font-mono); color: var(--text-dim); margin-top: 18px;">You may close this browser window.</p>
        </div>
      `;
    }

    function showError(message) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('contentState').style.display = 'none';
      const result = document.getElementById('resultState');
      result.style.display = 'block';
      result.innerHTML = `
        <div class="result-view">
          <div class="result-glyph err">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </div>
          <div class="result-headline">Authorization Error</div>
          <div class="result-subline">${message}</div>
        </div>
      `;
    }

    window.onload = loadRequest;
  </script>
</body>
</html>
